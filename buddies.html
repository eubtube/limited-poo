<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div class="sparkle-field"></div>
    <div class="wrap">

      <section class="card">

          Meet the mall regulars. Looking for a quit sponsor? Filter Quit Crew. Looking to brag?

        </p>
        <label>
          Show

            <option value="yammer">yammer pals</option>

      </section>

      <div id="pup-list" class="pup-grid" style="margin-top: 18px"></div>

      <section class="card" style="margin-top: 22px">
        <h3>Want on the wall?</h3>
        <p>
          Yearbook slots are claimed with a magic email link, one pup per human.
          Millie already took the cover. <a href="login.html">Open the email locker →</a>

      </section>

      <footer class="mall-end" id="site-footer"></footer>
    </div>
    <script type="module" src="js/site.js"></script>
