<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email locker · LiMiTeD POO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Fredoka:wght@400;600;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/too.css" />
  </head>
  <body>
    <div class="sparkle-field"></div>
    <div class="wrap">
      <header id="site-header"></header>
      <section class="card">
        <h3>The email locker</h3>
        <p>
          Humans get a magic link. Pups get a yearbook slot. No password to bury in the yard —
          just a link in your inbox, then you claim a unique pup name.
        </p>
        <form class="pretty" id="login-form">
          <label>Human email <input type="email" name="email" required placeholder="you@mall.example" /></label>
          <button type="submit">send the sparkly link</button>
        </form>
      </section>
      <footer class="mall-end" id="site-footer"></footer>
    </div>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
